<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta charset="UTF-8">

  <title>Drankbestelling</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>
    :root {
      --blokbreedte: 400px;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 20px;
    }

    h2 {
      color: #333;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .top-balk,
    .drank-blok,
    .toggle-knop {
      width: min(100%, var(--blokbreedte));
      box-sizing: border-box;
    }

    .top-balk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .toggle-knop {
      display: block;
      margin-bottom: 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .toggle-knop:hover {
      background-color: #218838;
    }

    .drank-blok {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .drank {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 10px 0;
    }

    .drank-naam {
      flex: 1;
    }

    .bediening {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 18px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .aantal {
      width: 30px;
      text-align: center;
      font-weight: bold;
    }

    #reset {
      background-color: #dc3545;
    }

    #reset:hover {
      background-color: #b02a37;
    }

    /* Opmaak van de bon */
    .bon-rij {
      padding: 8px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .bon-rij:last-child {
      border-bottom: none;
    }

    .bon-aantal {
      min-width: 40px;
      text-align: right;
      font-weight: bold;
    }

    .lege-bon {
      color: #666;
      font-style: italic;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="top-balk">
    <div>
      Totaal aantal drankjes:
      <span id="totaalAantal">0</span>
    </div>

    <button id="reset" type="button">
      Reset
    </button>
  </div>

  <button
    id="toggleKnop"
    class="toggle-knop"
    type="button"
  >
    Bon
  </button>

  <div id="drankenContainer"></div>

  <script src="dranken.js"></script>

  <script>
    /*
     * De aantallen worden hier bewaard.
     * De HTML-weergave is daardoor niet langer de gegevensbron.
     */
    const aantallen = {};

    /*
     * false = bestellijst
     * true  = bon
     */
    let bonModus = false;

    const container = document.getElementById("drankenContainer");
    const toggleKnop = document.getElementById("toggleKnop");
    const resetKnop = document.getElementById("reset");
    const totaalAantal = document.getElementById("totaalAantal");

function updateKnopTekst() {
toggleKnop.textContent = bonModus
? "Bestel"
: "Bon";
}

    /*
     * Maak voor elke drank een beginwaarde van 0.
     */
    function initialiseerAantallen() {
      drankData.forEach(categorie => {
        categorie.dranken.forEach(drank => {
          aantallen[drank.id] = 0;
        });
      });
    }

    /*
     * Toon de gewone bestellijst:
     * categorieën, dranknamen, min- en plusknoppen.
     */
    function renderBestellijst() {
      container.innerHTML = "";

      drankData.forEach(categorie => {
        const blok = document.createElement("div");
        blok.className = "drank-blok";

        const titel = document.createElement("h2");
        titel.textContent = categorie.naam;
        blok.appendChild(titel);

        categorie.dranken.forEach(drank => {
          const rij = document.createElement("div");
          rij.className = "drank";

          const naam = document.createElement("span");
          naam.className = "drank-naam";
          naam.textContent = drank.naam;

          const bediening = document.createElement("div");
          bediening.className = "bediening";

          const minKnop = document.createElement("button");
          minKnop.type = "button";
          minKnop.textContent = "-";
          minKnop.setAttribute(
            "aria-label",
            "Verminder " + drank.naam
          );

          minKnop.addEventListener("click", () => {
            verlaag(drank.id);
          });

          const aantal = document.createElement("span");
          aantal.className = "aantal";
          aantal.id = "aantal-" + drank.id;
          aantal.textContent = aantallen[drank.id];

          const plusKnop = document.createElement("button");
          plusKnop.type = "button";
          plusKnop.textContent = "+";
          plusKnop.setAttribute(
            "aria-label",
            "Verhoog " + drank.naam
          );

          plusKnop.addEventListener("click", () => {
            verhoog(drank.id);
          });

          bediening.appendChild(minKnop);
          bediening.appendChild(aantal);
          bediening.appendChild(plusKnop);

          rij.appendChild(naam);
          rij.appendChild(bediening);

          blok.appendChild(rij);
        });

        container.appendChild(blok);
      });
    }

    /*
     * Toon de bon:
     * alle gekozen dranken in één blok,
     * zonder categorieën en zonder knoppen.
     */
    function renderBon() {
      container.innerHTML = "";

      const bonBlok = document.createElement("div");
      bonBlok.className = "drank-blok";

      let heeftDranken = false;

      drankData.forEach(categorie => {
        categorie.dranken.forEach(drank => {
          const aantal = aantallen[drank.id];

          if (aantal > 0) {
            heeftDranken = true;

            const rij = document.createElement("div");
            rij.className = "drank bon-rij";

            const naam = document.createElement("span");
            naam.className = "drank-naam";
            naam.textContent = drank.naam;

            const aantalElement = document.createElement("span");
            aantalElement.className = "bon-aantal";
            aantalElement.textContent = aantal;

            rij.appendChild(naam);
            rij.appendChild(aantalElement);

            bonBlok.appendChild(rij);
          }
        });
      });

      /*
       * Als nog niets geselecteerd is, toon dan een melding
       * in plaats van een leeg wit blok.
       */
      if (!heeftDranken) {
        const melding = document.createElement("p");
        melding.className = "lege-bon";
        melding.textContent = "Er zijn nog geen dranken geselecteerd.";

        bonBlok.appendChild(melding);
      }

      container.appendChild(bonBlok);
    }

    /*
     * Verhoog een drank met één.
     */
    function verhoog(id) {
      aantallen[id] += 1;

      updateTotaal();
      updateAantalOpScherm(id);
    }

    /*
     * Verlaag een drank met één, maar nooit lager dan nul.
     */
    function verlaag(id) {
      if (aantallen[id] > 0) {
        aantallen[id] -= 1;
      }

      updateTotaal();
      updateAantalOpScherm(id);
    }

    /*
     * Werk alleen het zichtbare aantal van één drank bij.
     */
    function updateAantalOpScherm(id) {
      const element = document.getElementById("aantal-" + id);

      if (element) {
        element.textContent = aantallen[id];
      }
    }

    /*
     * Bereken het totale aantal vanuit het aantallen-object.
     */
    function updateTotaal() {
      let totaal = 0;

      Object.values(aantallen).forEach(aantal => {
        totaal += aantal;
      });

      totaalAantal.textContent = totaal;
    }

    /*
     * Wissel tussen bestellijst en bon.
     */

function toggleWeergave() {
bonModus = !bonModus;
 
updateKnopTekst();
 
if (bonModus) {
renderBon();
} else {
renderBestellijst();
}
}

    /*
     * Zet alle aantallen terug op nul.
     */
    function resetAlles() {
      Object.keys(aantallen).forEach(id => {
        aantallen[id] = 0;
      });

bonModus = false;
updateKnopTekst();

      updateTotaal();
      renderBestellijst();
    }

    /*
     * Koppel de knoppen aan hun functies.
     */
    toggleKnop.addEventListener("click", toggleWeergave);
    resetKnop.addEventListener("click", resetAlles);

    /*
     * Start de toepassing.
     */
    initialiseerAantallen();
    updateTotaal();
    renderBestellijst();
  </script>
</body>
</html>
