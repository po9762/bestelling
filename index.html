<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>De Leste</title>

  <style>
    :root {
      --blokbreedte: 400px;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 20px;
    }

    h2 {
      color: #333;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .top-balk,
    .knoppen-balk,
    .drank-blok {
      width: min(100%, var(--blokbreedte));
      box-sizing: border-box;
    }

    .top-balk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .knoppen-balk {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    /*
     * Algemene knopstijl.
     * touch-action: manipulation voorkomt dubbeltik-zoom bij snel
     * tikken, terwijl knijpen om te zoomen gewoon blijft werken.
     */
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 22px;
      min-width: 44px;
      min-height: 44px;
      padding: 6px 12px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      filter: brightness(0.85);
    }

    .toggle-knop {
      flex: 1;
      box-sizing: border-box;
      background-color: #28a745;
      border-radius: 12px;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    #compactKnop {
      background-color: #6c757d;
    }

    #compactKnop.actief {
      background-color: #fd7e14;
    }

    #installKnop {
      background-color: #007bff;
    }

    #reset {
      background-color: #dc3545;
      font-size: 18px;
    }

    /*
     * Hover-kleuren alleen op toestellen met een muis,
     * zodat ze op een touchscreen niet blijven "plakken".
     */
    @media (hover: hover) {
      button:hover { background-color: #0056b3; }
      .toggle-knop:hover { background-color: #218838; }
      #compactKnop:hover { background-color: #5a6268; }
      #compactKnop.actief:hover { background-color: #dc6c0b; }
      #installKnop:hover { background-color: #0056b3; }
      #reset:hover { background-color: #b02a37; }
    }

    .drank-blok {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .drank {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
    }

    .drank-naam {
      flex: 1;
      font-size: 18px;
    }

    .bediening {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .aantal {
      width: 32px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }

    .bon-rij {
      padding: 8px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .bon-rij:last-child {
      border-bottom: none;
    }

    .bon-aantal {
      min-width: 40px;
      text-align: right;
      font-weight: bold;
      font-size: 20px;
    }

    .lege-bon {
      color: #666;
      font-style: italic;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="top-balk">
    <div>
      Totaal aantal drankjes:
      <span id="totaalAantal">0</span>
    </div>

    <button id="reset" type="button">
      Reset
    </button>
  </div>

  <div class="knoppen-balk">
    <button
      id="toggleKnop"
      class="toggle-knop"
      type="button"
    >
      Bon
    </button>

    <button
      id="compactKnop"
      class="toggle-knop"
      type="button"
    >
      Compact
    </button>

    <button
      id="installKnop"
      class="toggle-knop"
      type="button"
      hidden
    >
      Op beginscherm zetten
    </button>
  </div>

  <div id="drankenContainer"></div>

  <script src="dranken.js"></script>

  <script>
    /*
     * Sleutel waaronder de bestelling in het geheugen
     * van de browser bewaard wordt.
     */
    const OPSLAG_SLEUTEL = "de-leste-bestelling";

    /*
     * Hier worden de aantallen van alle dranken bewaard.
     */
    const aantallen = {};

    /*
     * false = bestellijst
     * true = bon
     */
    let bonModus = false;

    /*
     * false = alle dranken tonen
     * true = compacte drankenlijst tonen
     */
    let compacteModus = true;

    const container =
      document.getElementById("drankenContainer");

    const toggleKnop =
      document.getElementById("toggleKnop");

    const compactKnop =
      document.getElementById("compactKnop");

    const resetKnop =
      document.getElementById("reset");

    const installKnop =
      document.getElementById("installKnop");

    const totaalAantal =
      document.getElementById("totaalAantal");

    /*
     * Bewaar de bestelling en de compacte modus, zodat niets
     * verloren gaat bij herladen of wanneer de telefoon de app
     * op de achtergrond afsluit.
     */
    function bewaar() {
      try {
        localStorage.setItem(
          OPSLAG_SLEUTEL,
          JSON.stringify({ aantallen, compacteModus })
        );
      } catch (error) {
        // Opslag niet beschikbaar (bv. privévenster): app werkt verder.
      }
    }

    /*
     * Laad een eerder bewaarde bestelling.
     * Alleen dranken die nog in dranken.js staan worden overgenomen,
     * zodat een aangepaste drankenlijst niets kapotmaakt.
     */
    function laad() {
      try {
        const tekst = localStorage.getItem(OPSLAG_SLEUTEL);

        if (!tekst) {
          return;
        }

        const opgeslagen = JSON.parse(tekst);

        if (opgeslagen.aantallen) {
          Object.keys(aantallen).forEach(id => {
            const waarde = Number(opgeslagen.aantallen[id]);

            if (Number.isInteger(waarde) && waarde > 0) {
              aantallen[id] = waarde;
            }
          });
        }

        if (typeof opgeslagen.compacteModus === "boolean") {
          compacteModus = opgeslagen.compacteModus;
        }
      } catch (error) {
        // Beschadigde of onleesbare opslag: begin met een lege bestelling.
      }
    }

    /*
     * PWA-installatie:
     * - Verberg de knop wanneer de pagina al als geïnstalleerde app draait.
     * - Android/Chrome: gebruik de native installatieprompt.
     * - iPhone/iPad: Safari kan installatie niet via JavaScript starten,
     *   dus toon de stappen om de pagina via Delen aan het beginscherm toe te voegen.
     */
    let uitgesteldeInstallatiePrompt = null;

    const standaloneQuery =
      window.matchMedia("(display-mode: standalone)");

    function draaitAlsGeinstalleerdeApp() {
      return (
        standaloneQuery.matches ||
        window.navigator.standalone === true
      );
    }

    function updateInstallKnop() {
      installKnop.hidden = draaitAlsGeinstalleerdeApp();
    }

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      uitgesteldeInstallatiePrompt = event;
      updateInstallKnop();
    });

    window.addEventListener("appinstalled", () => {
      uitgesteldeInstallatiePrompt = null;
      updateInstallKnop();
    });

    installKnop.addEventListener("click", async () => {
      if (uitgesteldeInstallatiePrompt) {
        uitgesteldeInstallatiePrompt.prompt();

        try {
          await uitgesteldeInstallatiePrompt.userChoice;
        } catch (error) {
          // De gebruiker kan de installatieprompt sluiten; dat is geen fout.
        }

        uitgesteldeInstallatiePrompt = null;
        updateInstallKnop();
        return;
      }

      const isAppleMobile =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isAppleMobile) {
        alert(
          "Op iPhone/iPad: tik op de knop 'Delen' in Safari en kies 'Zet op beginscherm'."
        );
      } else {
        alert(
          "Gebruik het installatie- of deelmenu van je browser om deze pagina aan het beginscherm toe te voegen."
        );
      }
    });

    if (standaloneQuery.addEventListener) {
      standaloneQuery.addEventListener("change", updateInstallKnop);
    }

    window.addEventListener("pageshow", updateInstallKnop);
    updateInstallKnop();

    /*
     * Service worker registreren, zodat de app ook zonder
     * internet opent. Werkt alleen via https (zoals GitHub Pages).
     */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .catch(() => {
            // Geen service worker (bv. lokaal geopend bestand): app werkt online verder.
          });
      });
    }

    /*
     * Beheer de tekst van de Bon-knop op één plaats.
     */
    function updateKnopTekst() {
      toggleKnop.textContent = bonModus
        ? "Bestel"
        : "Bon";
    }

    /*
     * Beheer de tekst en kleur van de Compact-knop.
     */
    function updateCompactKnopTekst() {
      compactKnop.textContent = compacteModus
        ? "Volledig"
        : "Compact";

      compactKnop.classList.toggle(
        "actief",
        compacteModus
      );
    }

    /*
     * Maak voor iedere drank een beginwaarde van nul.
     */
    function initialiseerAantallen() {
      drankData.forEach(categorie => {
        categorie.dranken.forEach(drank => {
          aantallen[drank.id] = 0;
        });
      });
    }

    /*
     * Controleer of een drank zichtbaar moet zijn.
     *
     * In compacte modus worden dranken met
     * verborgenInCompact: true niet getoond,
     * BEHALVE als er al iets van besteld is.
     * Zo verdwijnt een bestelde drank nooit uit beeld.
     */
    function isDrankZichtbaar(drank) {
      return (
        !compacteModus ||
        drank.verborgenInCompact !== true ||
        aantallen[drank.id] > 0
      );
    }

    /*
     * Bouw de bestellijst op.
     */
    function renderBestellijst() {
      container.innerHTML = "";

      drankData.forEach(categorie => {
        const zichtbareDranken =
          categorie.dranken.filter(isDrankZichtbaar);

        /*
         * Toon geen leeg categorieblok.
         */
        if (zichtbareDranken.length === 0) {
          return;
        }

        const blok = document.createElement("div");
        blok.className = "drank-blok";
        blok.id = categorie.id;

        const titel = document.createElement("h2");
        titel.textContent = categorie.naam;

        blok.appendChild(titel);

        zichtbareDranken.forEach(drank => {
          const rij = document.createElement("div");
          rij.className = "drank";

          const naam = document.createElement("span");
          naam.className = "drank-naam";
          naam.textContent = drank.naam;

          const bediening =
            document.createElement("div");

          bediening.className = "bediening";

          const minKnop =
            document.createElement("button");

          minKnop.type = "button";
          minKnop.textContent = "−";

          minKnop.setAttribute(
            "aria-label",
            "Verminder " + drank.naam
          );

          minKnop.addEventListener("click", () => {
            verlaag(drank.id);
          });

          const aantal =
            document.createElement("span");

          aantal.className = "aantal";
          aantal.id = "aantal-" + drank.id;
          aantal.textContent = aantallen[drank.id];

          const plusKnop =
            document.createElement("button");

          plusKnop.type = "button";
          plusKnop.textContent = "+";

          plusKnop.setAttribute(
            "aria-label",
            "Verhoog " + drank.naam
          );

          plusKnop.addEventListener("click", () => {
            verhoog(drank.id);
          });

          bediening.appendChild(minKnop);
          bediening.appendChild(aantal);
          bediening.appendChild(plusKnop);

          rij.appendChild(naam);
          rij.appendChild(bediening);

          blok.appendChild(rij);
        });

        container.appendChild(blok);
      });
    }

    /*
     * Toon alle bestelde dranken in één blok.
     *
     * Compacte modus heeft geen invloed op de bon.
     */
    function renderBon() {
      container.innerHTML = "";

      const bonBlok = document.createElement("div");
      bonBlok.className = "drank-blok";

      let heeftDranken = false;

      drankData.forEach(categorie => {
        categorie.dranken.forEach(drank => {
          const aantal = aantallen[drank.id];

          if (aantal > 0) {
            heeftDranken = true;

            const rij = document.createElement("div");
            rij.className = "drank bon-rij";

            const naam = document.createElement("span");
            naam.className = "drank-naam";
            naam.textContent = drank.naam;

            const aantalElement =
              document.createElement("span");

            aantalElement.className = "bon-aantal";
            aantalElement.textContent = aantal;

            rij.appendChild(naam);
            rij.appendChild(aantalElement);

            bonBlok.appendChild(rij);
          }
        });
      });

      if (!heeftDranken) {
        const melding = document.createElement("p");
        melding.className = "lege-bon";

        melding.textContent =
          "Er zijn nog geen dranken geselecteerd.";

        bonBlok.appendChild(melding);
      }

      container.appendChild(bonBlok);
    }

    /*
     * Verhoog een drank met één.
     */
    function verhoog(id) {
      aantallen[id] += 1;

      updateTotaal();
      updateAantalOpScherm(id);
      bewaar();
    }

    /*
     * Verlaag een drank met één, maar nooit onder nul.
     */
    function verlaag(id) {
      if (aantallen[id] > 0) {
        aantallen[id] -= 1;
      }

      updateTotaal();
      updateAantalOpScherm(id);
      bewaar();
    }

    /*
     * Werk het zichtbare aantal van één drank bij.
     */
    function updateAantalOpScherm(id) {
      const element =
        document.getElementById("aantal-" + id);

      if (element) {
        element.textContent = aantallen[id];
      }
    }

    /*
     * Bereken het totale aantal drankjes.
     */
    function berekenTotaal() {
      return Object.values(aantallen).reduce(
        (som, aantal) => som + aantal,
        0
      );
    }

    function updateTotaal() {
      totaalAantal.textContent = berekenTotaal();
    }

    /*
     * Wissel tussen de bestellijst en de bon.
     */
    function toggleWeergave() {
      bonModus = !bonModus;

      updateKnopTekst();

      if (bonModus) {
        renderBon();
      } else {
        renderBestellijst();
      }
    }

    /*
     * Zet de compacte modus aan of uit.
     */
    function toggleCompacteModus() {
      compacteModus = !compacteModus;

      updateCompactKnopTekst();
      bewaar();

      /*
       * Als de bon zichtbaar is, blijft deze ongewijzigd.
       * De compacte instelling wordt gebruikt wanneer de
       * gebruiker terugkeert naar de bestellijst.
       */
      if (!bonModus) {
        renderBestellijst();
      }
    }

    /*
     * Zet alle aantallen terug op nul, na bevestiging.
     * De gekozen compacte modus blijft behouden.
     */
    function resetAlles() {
      if (
        berekenTotaal() > 0 &&
        !confirm("Hele bestelling wissen?")
      ) {
        return;
      }

      Object.keys(aantallen).forEach(id => {
        aantallen[id] = 0;
      });

      bonModus = false;

      bewaar();
      updateTotaal();
      updateKnopTekst();
      updateCompactKnopTekst();
      renderBestellijst();
    }

    /*
     * Koppel de knoppen aan de functies.
     */
    toggleKnop.addEventListener(
      "click",
      toggleWeergave
    );

    compactKnop.addEventListener(
      "click",
      toggleCompacteModus
    );

    resetKnop.addEventListener(
      "click",
      resetAlles
    );

    /*
     * Start de toepassing.
     */
    initialiseerAantallen();
    laad();
    updateTotaal();
    updateKnopTekst();
    updateCompactKnopTekst();
    renderBestellijst();
  </script>
</body>
</html>
